# Dot Matrix Deck key bindings
#
# Each line maps one logical key to one or more physical keys.
# Physical keys use SDL scancode names, for example: z, return, up.
# Lines that start with # are comments. Blank lines are ignored.
# The frontend loads this file from the working directory at start.

# Logical keys: right, left, up, down, a, b, select, start, pause, reset, fast_forward

a = z
b = x
select = left shift, right shift
start = return
right = right
left = left
up = up
down = down
pause = p
reset = r
fast_forward = f
